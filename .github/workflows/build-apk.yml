name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
      GODOT_STATUS: "stable"
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build-tools
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | head -n 1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q godot.zip -d godot_bin
          mkdir -p "$HOME/bin"
          mv godot_bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 "$HOME/bin/godot"
          chmod +x "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install Godot export templates
        run: |
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d tpl_tmp
          mv tpl_tmp/templates/* "$TPL_DIR/"

      - name: Unpack Android Gradle build template into the project
        run: |
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p android/build
          unzip -q "$TPL_DIR/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.${GODOT_STATUS}" > android/.build_version

      - name: Create debug keystore and point Godot at SDK, JDK and keystore
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$HOME/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          printf '%s\n' \
            "keystore/debug=\"$HOME/debug.keystore\"" \
            'keystore/debug_user="androiddebugkey"' \
            'keystore/debug_password="android"' >> export_presets.cfg

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Diagnose Android/Java setup
        run: |
          echo "--- editor settings ---"
          cat "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          echo "--- SDK ---"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/platform-tools" | head -n 5 || true
          echo "--- Java ---"
          java -version 2>&1 || true
          ls "$JAVA_HOME/bin" | tr '\n' ' ' || true
          echo; echo "--- keystore ---"
          ls -la "$HOME/debug.keystore" || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/game-a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: game-a-apk
          path: build/game-a.apk

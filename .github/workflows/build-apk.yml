name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create debug keystore (on the runner, shared into the container)
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          printf '%s\n' \
            'keystore/debug="/host/debug.keystore"' \
            'keystore/debug_user="androiddebugkey"' \
            'keystore/debug_password="android"' >> export_presets.cfg

      - name: Import and export APK in godot-ci container
        run: |
          docker run --rm --entrypoint /bin/bash \
            -v "$PWD:/game" -v "$HOME:/host" -w /game \
            barichello/godot-ci:4.3 -c '
              set -x
              which godot || true
              echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" || true
              godot --version || true
              godot --headless --path . --import || true
              mkdir -p build
              godot --headless --verbose --path . --export-debug "Android" build/game-a.apk
            '

      - uses: actions/upload-artifact@v4
        with:
          name: game-a-apk
          path: build/game-a.apk

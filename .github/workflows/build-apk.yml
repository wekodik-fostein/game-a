name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build-tools and platform on the runner
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-34"

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          printf '%s\n' \
            'keystore/debug="/host/debug.keystore"' \
            'keystore/debug_user="androiddebugkey"' \
            'keystore/debug_password="android"' >> export_presets.cfg

      - name: Import and export APK in godot-ci container
        run: |
          docker run --rm --entrypoint /bin/bash \
            -e ANDROID_HOME=/android-sdk \
            -v "$ANDROID_HOME:/android-sdk" \
            -v "$PWD:/game" -v "$HOME:/host" -w /game \
            barichello/godot-ci:4.3 -c '
              set -e
              JH=$(dirname $(dirname $(readlink -f $(which java))))
              mkdir -p "$HOME/.config/godot"
              printf "%s\n" \
                "[gd_resource type=\"EditorSettings\" format=3]" "" "[resource]" \
                "export/android/android_sdk_path = \"/android-sdk\"" \
                "export/android/java_sdk_path = \"$JH\"" \
                "export/android/debug_keystore = \"/host/debug.keystore\"" \
                "export/android/debug_keystore_user = \"androiddebugkey\"" \
                "export/android/debug_keystore_pass = \"android\"" \
                > "$HOME/.config/godot/editor_settings-4.3.tres"
              echo "JAVA=$JH"; ls /android-sdk/build-tools
              godot --headless --path . --import || true
              mkdir -p build
              godot --headless --verbose --path . --export-debug "Android" build/game-a.apk
            '

      - uses: actions/upload-artifact@v4
        with:
          name: game-a-apk
          path: build/game-a.apk

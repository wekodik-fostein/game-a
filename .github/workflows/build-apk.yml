name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build-tools and platform
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-34"

      - name: Create debug keystore and Godot editor settings
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          printf '%s\n' \
            "keystore/debug=\"$HOME/debug.keystore\"" \
            'keystore/debug_user="androiddebugkey"' \
            'keystore/debug_password="android"' >> export_presets.cfg
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$HOME/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Export APK with firebelley/godot-export
        uses: firebelley/godot-export@v4
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          use_preset_export_path: true
          cache: true

      - uses: actions/upload-artifact@v4
        with:
          name: game-a-apk
          path: build/game-a.apk

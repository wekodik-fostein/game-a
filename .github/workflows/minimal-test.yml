name: Minimal Android export test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GODOT_URL: https://github.com/godotengine/godot/releases/download/4.3-stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build-tools and platform
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot 4.3 and export templates
        run: |
          mkdir -p "$HOME/bin" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fsSL -o godot.zip "$GODOT_URL/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q -o godot.zip -d godot_bin
          mv godot_bin/Godot_v4.3-stable_linux.x86_64 "$HOME/bin/godot"
          chmod +x "$HOME/bin/godot"
          curl -fsSL -o templates.tpz "$GODOT_URL/Godot_v4.3-stable_export_templates.tpz"
          unzip -q templates.tpz -d tpl_tmp
          mv tpl_tmp/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Create debug keystore and Android settings for both Godot filenames
        run: |
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          printf '%s\n' \
            "keystore/debug=\"$HOME/debug.keystore\"" \
            'keystore/debug_user="androiddebugkey"' \
            'keystore/debug_password="android"' >> minimal/export_presets.cfg
          mkdir -p "$HOME/.config/godot"
          for v in 4 4.3; do
            printf '%s\n' \
              '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
              "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
              "export/android/java_sdk_path = \"$JAVA_HOME\"" \
              "export/android/debug_keystore = \"$HOME/debug.keystore\"" \
              'export/android/debug_keystore_user = "androiddebugkey"' \
              'export/android/debug_keystore_pass = "android"' \
              > "$HOME/.config/godot/editor_settings-$v.tres"
          done

      - name: Import and export debug APK
        run: |
          godot --headless --path minimal --import || true
          mkdir -p build
          godot --headless --verbose --path minimal --export-debug "Android" build/game-a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: game-a-apk
          path: build/game-a.apk
